server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cloudvault?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:cloudvault}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
      file-size-threshold: 0
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
vault:
  base-url: ${BASE_URL:http://localhost:8080}
  storage: ${STORAGE_MODE:local}
  directory: ${STORAGE_DIR:./data/files}
  bucket: ${S3_BUCKET:}
  region: ${AWS_REGION:ap-south-1}
  endpoint: ${S3_ENDPOINT:}
  mail-mode: ${MAIL_MODE:smtp}
  mail-from: ${MAIL_FROM:cloudvault@example.test}
  brevo-key: ${BREVO_API_KEY:}
  demo-enabled: ${DEMO_ENABLED:true}
  max-accounts: ${MAX_ACCOUNTS:30}
  global-limit: ${GLOBAL_LIMIT_BYTES:2147483648}
