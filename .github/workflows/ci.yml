name: CloudVault CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for f in src/main/resources/static/*.js; do node --check "$f"; done
