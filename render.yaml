services:
  - type: web
    name: cloudvault
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: 'true'
      - key: STORAGE_MODE
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MAIL_MODE
        value: brevo
      - key: MAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: DEMO_ENABLED
        value: 'true'
      - key: MAX_ACCOUNTS
        value: '20'
      - key: GLOBAL_LIMIT_BYTES
        value: '2147483648'
