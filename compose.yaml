services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cloudvault
      MYSQL_USER: cloudvault
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent && mysql -ucloudvault -p\"$$MYSQL_PASSWORD\" cloudvault -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cloudvault?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: cloudvault
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STORAGE_MODE: ${STORAGE_MODE:-local}
      STORAGE_DIR: /app/data/files
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      MAIL_MODE: ${MAIL_MODE:-smtp}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-cloudvault@example.test}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      MAX_ACCOUNTS: ${MAX_ACCOUNTS:-30}
      GLOBAL_LIMIT_BYTES: ${GLOBAL_LIMIT_BYTES:-2147483648}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - files:/app/data/files
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
volumes:
  db:
  files:
